<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>食品の表示</title>
<style>
  :root { --bg:#f4f1ec; --fg:#2b2b2b; --muted:#6b6b6b; --accent:#b4532a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#f4f1ec; --fg:#2b2b2b; } } /* 刺激の見え方を端末設定で変えないため、常に明るい背景 */
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; overscroll-behavior:none; }
  #app { height:100svh; display:flex; flex-direction:column; padding:12px 16px 16px; gap:8px; }
  #instr { font-size:15px; text-align:center; margin:0; min-height:1.6em; }
  #stage { flex:1; min-height:0; position:relative; }
  model-viewer, #img2d { position:absolute; inset:0; width:100%; height:100%; background:var(--bg); --poster-color:var(--bg); }
  #img2d { object-fit:contain; }
  #bar { text-align:center; }
  #err { display:none; text-align:center; color:#a00; font-size:14px; }
  #credit { font-size:11px; line-height:1.5; color:var(--muted); text-align:center; margin:2px 0 0; }
  #credit a { color:inherit; }
  #tools { display:none; text-align:center; }
  button { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid #888; background:#fff; }
</style>
</head>
<body>
<div id="app">
  <p id="instr"></p>
  <div id="stage"></div>
  <div id="bar">
    <div id="err"></div>
    <div id="tools"><button id="snap">この向きをPNG保存(2D画像用)</button></div>
  </div>
  <p id="credit"></p>
</div>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
/* ===== 設定 =====
   URL例: index.html?mode=manual&food=burger
   mode: 2d(静止画) / auto(自動回転) / manual(自分で操作) / capture(2D用の画像を書き出す補助)
   food: FOODS のキー
   時間制限・確認コードはありません。参加者は好きなだけ見て、フォームに戻れます。
*/
/* credit: CC BY の表示用。title=作品名, author=作者名, url=Sketchfabの元ページ
   ※ 寿司・ラーメンの url は Sketchfab の「COPY CREDITS」で出るリンクを貼ってください */
const MODIFIED = '本ページ用にGLB形式へ変換・表示条件を調整';   // 改変した内容(実際に行ったことに合わせて書き換える)
const LICENSE = { name:'CC BY 4.0', url:'https://creativecommons.org/licenses/by/4.0/' };  // Sketchfab表示は "Creative Commons Attribution"。版は各モデルのページで確認
const FOODS = {
  burger: { name:'ハンバーガー', src:'models/burger.glb', img:'img/burger.png', code:'H',
            credit:{ title:'Tripo-Hamburgers generated by AI.', author:'TripoAI-user',
                     url:'https://sketchfab.com/3d-models/tripo-hamburgers-generated-by-ai-2417c06e456c4dc7afeea4a84742b8f9' } },
  sushi:  { name:'寿司',         src:'models/sushi.glb',  img:'img/sushi.png',  code:'S',
            credit:{ title:'Toro sushi', author:'Nestaeric', url:'https://sketchfab.com/3d-models/toro-sushi-14d73356e0484cc1936680b4b2a87cd5' } },
  ramen:  { name:'ラーメン',     src:'models/ramen.glb',  img:'img/ramen.png',  code:'R',
            credit:{ title:'Tonkotsu Ramen', author:'Kenty110', url:'https://sketchfab.com/3d-models/tonkotsu-ramen-861d9454b8f3441bbe6473e88de033d3' } }
};
const VIEW = {
  orbit: '0deg 65deg auto',          // 初期の向き(横回転0度、上から65度)。全条件で同じ
  minOrbit: 'auto 40deg auto',       // 真上寄りの限界
  maxOrbit: 'auto 90deg auto',       // 真横まで。底面は見えない
  autoSpeed: '30deg',                // 自動回転の速さ(1秒あたり)
  exposure: '1', shadow: '0.8'
};
const INSTR = {
  '2d':     f => `${f}の画像を、よく見てください。`,
  'auto':   f => `${f}が回転します。よく見てください。`,
  'manual': f => `${f}を、指やマウスで回して見てください。`
};

/* ===== 本体 ===== */
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || '2d';
const foodKey = q.get('food') || 'burger';
const food = FOODS[foodKey] || FOODS.burger;
const $ = id => document.getElementById(id);
const stage = $('stage');

$('instr').textContent = (INSTR[mode] || (() => ''))(food.name);

(function renderCredit(){
  const c = food.credit; if (!c) return;
  const el = $('credit');
  const add = (node) => el.appendChild(node);
  const text = s => document.createTextNode(s);
  const link = (label, href) => { const a=document.createElement('a'); a.textContent=label; a.href=href; a.target='_blank'; a.rel='noopener'; return a; };
  add(text('3Dモデル: '));
  add(c.url ? link('"' + c.title + '"', c.url) : text('"' + c.title + '"'));
  add(text(' by ' + c.author + '(Sketchfab)/ライセンス: '));
  add(link(LICENSE.name, LICENSE.url));
  add(text('/改変: ' + MODIFIED));
})();

function showError(msg){ const e=$('err'); e.textContent=msg; e.style.display='block'; }

function build3D(withControls, autoRotate){
  const mv = document.createElement('model-viewer');
  mv.setAttribute('src', food.src);
  mv.setAttribute('alt', food.name + 'の3Dモデル');
  mv.setAttribute('camera-orbit', VIEW.orbit);
  mv.setAttribute('min-camera-orbit', VIEW.minOrbit);
  mv.setAttribute('max-camera-orbit', VIEW.maxOrbit);
  mv.setAttribute('disable-zoom', '');
  mv.setAttribute('disable-pan', '');
  mv.setAttribute('interaction-prompt', 'none');
  mv.setAttribute('touch-action', 'none');
  mv.setAttribute('environment-image', 'neutral');
  mv.setAttribute('exposure', VIEW.exposure);
  mv.setAttribute('shadow-intensity', VIEW.shadow);
  mv.setAttribute('loading', 'eager');
  if (withControls) mv.setAttribute('camera-controls', '');
  if (autoRotate) {
    mv.setAttribute('auto-rotate', '');
    mv.setAttribute('auto-rotate-delay', '0');
    mv.setAttribute('rotation-per-second', VIEW.autoSpeed);
    mv.style.pointerEvents = 'none';           // 自動回転条件では操作できないようにする
  }
  mv.addEventListener('error', () => showError('3Dモデルを読み込めませんでした。通信状況を確認して、ページを再読み込みしてください。'));
  stage.appendChild(mv);
  return mv;
}

if (mode === '2d') {
  const img = document.createElement('img');
  img.id = 'img2d'; img.alt = food.name + 'の画像'; img.draggable = false;
  img.addEventListener('error', () => showError('画像を読み込めませんでした。ページを再読み込みしてください。'));
  img.src = food.img;
  stage.appendChild(img);
} else if (mode === 'auto') {
  build3D(false, true);
} else if (mode === 'manual') {
  build3D(true, false);
} else if (mode === 'capture') {
  // 2D画像を3D表示と同じモデル・照明・向きから作るための補助(研究者用)
  const mv = build3D(true, false);
  $('instr').textContent = '【研究者用】向きを確認して「PNG保存」を押す。初期の向きのまま保存するにはページを開き直した直後に押す。';
  $('tools').style.display = 'block';
  $('snap').onclick = async () => {
    const blob = await mv.toBlob({ mimeType: 'image/png' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = foodKey + '.png'; a.click();
  };
} else {
  showError('mode が正しくありません(2d / auto / manual)。');
}
</script>
</body>
</html>
